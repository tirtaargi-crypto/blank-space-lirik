<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Lyrics · Blank Space</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
    body {
      font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex; align-items: center; justify-content: center;
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      user-select: none; -webkit-tap-highlight-color: transparent;
    }
    
    .bg-gradient {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: url('foto2.jpg') center/cover no-repeat;
      z-index: 0;
    }
    
    .bg-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      z-index: 0;
    }
    
    #particles-canvas {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none; z-index: 1;
    }
    .app-container {
      position: relative; z-index: 2; width: 100%; height: 100%;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 16px;
    }
    .content {
      width: 100%; max-width: 400px; height: 100%;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 10px;
    }
    
    .album-artwork {
      width: min(200px, 50vw); height: min(200px, 50vw);
      border-radius: 16px;
      background: url('foto1.jpg') center/cover no-repeat;
      position: relative; 
      box-shadow: 0 30px 60px rgba(0,0,0,0.9), 0 0 0 1px rgba(255,255,255,0.1);
      transition: all 0.6s cubic-bezier(0.22, 0.61, 0.36, 1); 
      flex-shrink: 0;
    }
    
    .album-artwork::before {
      content: '';
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      border-radius: 16px;
      background: linear-gradient(135deg, rgba(255,255,255,0.08) 0%, transparent 50%, rgba(255,255,255,0.05) 100%);
      z-index: 1;
      pointer-events: none;
    }
    
    .album-artwork.hidden { 
      opacity: 0; transform: scale(0.85); width: 0; height: 0; margin: 0; 
    }
    
    .song-info { text-align: center; transition: opacity 0.5s; }
    .song-title { font-size: clamp(20px,5vw,26px); font-weight: 600; color: #fff; text-shadow: 0 2px 10px rgba(0,0,0,0.5); }
    .artist-name { font-size: clamp(14px,3.5vw,17px); color: rgba(255,255,255,0.7); text-shadow: 0 2px 8px rgba(0,0,0,0.5); }
    .song-info.fade-out { opacity: 0; }
    .play-button-large {
      width: 60px; height: 60px; border-radius: 50%; background: #fff;
      border: none; cursor: pointer; display: flex; align-items: center; justify-content: center;
      box-shadow: 0 12px 30px rgba(255,255,255,0.2), 0 0 0 1px rgba(255,255,255,0.1); 
      flex-shrink: 0; transition: all 0.2s ease;
    }
    .play-button-large svg { width: 26px; height: 26px; fill: #000; margin-left: 3px; }
    .play-button-large:active { transform: scale(0.93); }
    .play-button-large.hidden { display: none; }
    .lyrics-container {
      width: 100%; min-height: 60px; display: flex; align-items: center;
      justify-content: center; flex-shrink: 0;
    }
    .lyric-line {
      font-size: clamp(18px,4.5vw,22px); font-weight: 500; color: #fff;
      text-align: center; line-height: 1.4;
      text-shadow: 0 0 24px rgba(255,255,255,0.7);
      transition: opacity 0.12s ease, transform 0.12s ease;
      opacity: 0; transform: scale(0.96); padding: 0 10px;
    }
    .lyric-line.active {
      opacity: 1; transform: scale(1);
      text-shadow: 0 0 30px rgba(255,255,255,0.9), 0 0 60px rgba(255,255,255,0.3);
    }
    .player-card {
      width: 100%; background: rgba(0,0,0,0.4);
      backdrop-filter: blur(40px); -webkit-backdrop-filter: blur(40px);
      border-radius: 26px; padding: 12px 14px 10px;
      border: 0.5px solid rgba(255,255,255,0.12);
      box-shadow: 0 20px 40px rgba(0,0,0,0.6); flex-shrink: 0;
    }
    .player-card.hidden { display: none; }
    .progress-bar-bg {
      height: 3px; background: rgba(255,255,255,0.2); border-radius: 3px;
      width: 100%; cursor: pointer; margin-bottom: 4px;
    }
    .progress-fill {
      height: 100%; width: 0%; background: #fff; border-radius: 3px;
      box-shadow: 0 0 10px rgba(255,255,255,0.6);
      transition: width 0.1s linear;
    }
    .time-row {
      display: flex; justify-content: space-between; font-size: 10px;
      color: rgba(255,255,255,0.6); margin-bottom: 8px;
    }
    .controls-row {
      display: flex; align-items: center; justify-content: space-between;
      margin: 6px 0 4px;
    }
    .control-btn {
      background: transparent; border: none; color: #fff;
      width: 34px; height: 34px; border-radius: 50%; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    .control-btn:active { background: rgba(255,255,255,0.15); transform: scale(0.9); }
    .play-pause-btn {
      width: 44px; height: 44px; background: #fff; border-radius: 50%;
      border: none; cursor: pointer; display: flex; align-items: center;
      justify-content: center; box-shadow: 0 6px 20px rgba(0,0,0,0.5);
    }
    .play-pause-btn:active { transform: scale(0.9); }
    .volume-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 4px;
    }
    .volume-slider {
      width: 55px; height: 3px; -webkit-appearance: none;
      background: rgba(255,255,255,0.25); border-radius: 3px;
    }
    .volume-slider::-webkit-slider-thumb {
      -webkit-appearance: none; width: 14px; height: 14px;
      background: #fff; border-radius: 50%; box-shadow: 0 2px 8px rgba(0,0,0,0.5);
    }
  </style>
</head>

        <div class="volume-row">

            <svg width="14" height="14" viewBox="0 0 24 24" fill="white"><path d="M6 22h12l-6-6zM21 3H3c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h4v-2H3V5h18v12h-4v2h4c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2z"/></svg>
          </button>
          <input type="range" class="volume-slider" id="volumeSlider" min="0" max="1" step="0.01" value="0.8">
        </div>
      </div>
    </div>
  </div>

  <script>

      { time: 86.0, text: "" },

      { time: 103.0, text: "Be that girl for a month" },

      { time: 148.9, text: "And you love the game" },
      { time: 150.8, text: "Cause we're young and we're reckless" },
      { time: 153.0, text: "We'll take this way too far" },
      { time: 155.0, text: "It'll leave you breathless" },
      { time: 158.0, text: "Or with a nasty scar" },
      { time: 160.0, text: "Got a long list of ex-lovers" },
      { time: 162.5, text: "They'll tell you I'm insane" },
      { time: 166.0, text: "But I've got a blank space, baby" },
      { time: 169.0, text: "And I'll write your name" },

      { time: 175.0, text: "Don't say I didn't, say I didn't warn ya" },
      { time: 180.0, text: "Boys only want love if it's torture" },

      { time: 191.0, text: "So it's gonna be forever" },
      { time: 193.0, text: "Or it's gonna go down in flames" },

      { time: 201.0, text: "Got a long list of ex-lovers" },
      { time: 203.0, text: "They'll tell you I'm insane" },
      { time: 205.0, text: "'Cause you know I love the players" },
      { time: 208.0, text: "And you love the game" },
      { time: 210.0, text: "Cause we're young, and we're reckless" },
      { time: 213.0, text: "We'll take this way too far" },
      { time: 216.0, text: "It'll leave you breathless" },
      { time: 218.0, text: "Or with a nasty scar" },
      { time: 220.0, text: "Got a long list of ex-lovers" },
      { time: 223.0, text: "They'll tell you I'm insane" },
      { time: 227.0, text: "But I've got a blank space, baby" },
      { time: 229.0, text: "And I'll write your name" },
      { time: 231.0, text: "" }
    ];

    const audioPlayer = document.getElementById('audioPlayer');
    const albumCover = document.getElementById('albumCover');
    const songInfo = document.getElementById('songInfo');
    const playButtonLarge = document.getElementById('playButtonLarge');
    const lyricLine = document.getElementById('lyricLine');
    const playerCard = document.getElementById('playerCard');
    const playPauseBtn = document.getElementById('playPauseBtn');
    const playIcon = document.getElementById('playIcon');
    const pauseIcon = document.getElementById('pauseIcon');
    const progressFill = document.getElementById('progressFill');
    const currentTimeSpan = document.getElementById('currentTime');
    const durationSpan = document.getElementById('duration');
    const backwardBtn = document.getElementById('backwardBtn');
    const forwardBtn = document.getElementById('forwardBtn');
    const volumeSlider = document.getElementById('volumeSlider');
    const progressBarBg = document.getElementById('progressBarBg');

    audioPlayer.volume = 0.8;
    let isPlaying = false;
    let currentLyricIndex = -1;
    let animFrame = null;

    // Ambil durasi asli dari audio
    audioPlayer.addEventListener('loadedmetadata', () => {
      const realDuration = audioPlayer.duration;
      if (realDuration && !isNaN(realDuration)) {
        durationSpan.textContent = formatTime(realDuration);
      }
    });

    function formatTime(s) {
      if (isNaN(s)) return "0:00";
      const totalSec = Math.floor(s);
      const m = Math.floor(totalSec / 60);
      const sec = totalSec % 60;
      return `${m}:${sec < 10 ? '0' : ''}${sec}`;
    }

    function updateProgressDisplay() {
      const dur = audioPlayer.duration || 231;
      const p = Math.min(audioPlayer.currentTime / dur, 1);
      progressFill.style.width = `${p * 100}%`;
      currentTimeSpan.textContent = formatTime(audioPlayer.currentTime);
    }

    function getCurrentLyricIndex(time) {
      let idx = -1;
      for (let i = lyrics.length - 1; i >= 0; i--) {
        if (time >= lyrics[i].time) {
          idx = i;
          break;
        }
      }
      return idx;
    }

    function displayLyric(text) {
      if (lyricLine.textContent === text && lyricLine.classList.contains('active')) return;
      lyricLine.classList.remove('active');
      lyricLine.style.opacity = '0';
      lyricLine.style.transform = 'scale(0.96)';
      requestAnimationFrame(() => {
        lyricLine.textContent = text;
        lyricLine.classList.add('active');
        lyricLine.style.opacity = '1';
        lyricLine.style.transform = 'scale(1)';
      });
    }

    function clearLyricDisplay() {
      lyricLine.classList.remove('active');
      lyricLine.style.opacity = '0';
      lyricLine.textContent = '';
    }

    function updateLyricDisplay() {
      const idx = getCurrentLyricIndex(audioPlayer.currentTime);
      if (idx !== currentLyricIndex) {
        currentLyricIndex = idx;
        if (idx >= 0 && lyrics[idx].text.trim() !== '') {
          displayLyric(lyrics[idx].text);
        } else {
          clearLyricDisplay();
        }
      }
    }

    function animationLoop() {
      if (!isPlaying) return;
      updateProgressDisplay();
      updateLyricDisplay();
      const dur = audioPlayer.duration || 231;
      if (audioPlayer.currentTime >= dur) {
        pauseAudio();
        return;
      }
      animFrame = requestAnimationFrame(animationLoop);
    }

    function playAudio() {
      audioPlayer.currentTime = 0.01; // Mulai dari 0.01 detik
      const playPromise = audioPlayer.play();
      if (playPromise !== undefined) {
        playPromise.then(() => {
          isPlaying = true;
          playIcon.style.display = 'none';
          pauseIcon.style.display = 'block';
          animFrame = requestAnimationFrame(animationLoop);
        }).catch(error => {
          console.log('Playback error:', error);
          alert('Tidak bisa memutar audio. Pastikan file blankspace.mp3 ada.');
        });
      }
    }

    function pauseAudio() {
      audioPlayer.pause();
      isPlaying = false;
      playIcon.style.display = 'block';
      pauseIcon.style.display = 'none';
      if (animFrame) {
        cancelAnimationFrame(animFrame);
        animFrame = null;
      }
    }

    function togglePlayPause() {
      if (isPlaying) {
        pauseAudio();
      } else {
        const playPromise = audioPlayer.play();
        if (playPromise !== undefined) {
          playPromise.then(() => {
            isPlaying = true;
            playIcon.style.display = 'none';
            pauseIcon.style.display = 'block';
            animFrame = requestAnimationFrame(animationLoop);
          }).catch(error => {
            console.log('Playback error:', error);
          });
        }
      }
    }

    function seekTo(time) {
      const dur = audioPlayer.duration || 231;
      audioPlayer.currentTime = Math.max(0, Math.min(time, dur));
      updateProgressDisplay();
      const idx = getCurrentLyricIndex(audioPlayer.currentTime);
      currentLyricIndex = idx;
      if (idx >= 0 && lyrics[idx].text.trim() !== '') {
        lyricLine.textContent = lyrics[idx].text;
        lyricLine.classList.add('active');
        lyricLine.style.opacity = '1';
        lyricLine.style.transform = 'scale(1)';
      } else {
        clearLyricDisplay();
      }
    }

    function startExperience() {
      albumCover.classList.add('hidden');
      songInfo.classList.add('fade-out');
      playButtonLarge.classList.add('hidden');
      playerCard.classList.remove('hidden');
      currentLyricIndex = -1;
      updateProgressDisplay();
      clearLyricDisplay();
      playAudio(); // Audio mulai dari 0.01 detik
    }

    playButtonLarge.addEventListener('click', startExperience);
    playPauseBtn.addEventListener('click', togglePlayPause);
    backwardBtn.addEventListener('click', () => seekTo(audioPlayer.currentTime - 10));
    forwardBtn.addEventListener('click', () => seekTo(audioPlayer.currentTime + 10));
    volumeSlider.addEventListener('input', (e) => { audioPlayer.volume = e.target.value; });
    progressBarBg.addEventListener('click', (e) => {
      const rect = progressBarBg.getBoundingClientRect();
      const frac = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
      const dur = audioPlayer.duration || 231;
      seekTo(frac * dur);
    });

    audioPlayer.addEventListener('ended', () => {
      pauseAudio();
      updateProgressDisplay();
    });

    durationSpan.textContent = "3:51";
    updateProgressDisplay();
    clearLyricDisplay();

    // Particles
    const canvas = document.getElementById('particles-canvas');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    class Particle {
      constructor() { this.reset(); }
      reset() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.size = Math.random() * 2 + 0.5;
        this.speedX = (Math.random() - 0.5) * 0.3;
        this.speedY = (Math.random() - 0.5) * 0.3;
        this.opacity = Math.random() * 0.5 + 0.3;
      }
      update() {
        this.x += this.speedX;
        this.y += this.speedY;
        if (this.x < -10 || this.x > canvas.width + 10 || this.y < -10 || this.y > canvas.height + 10) {
          this.reset();
        }
      }
      draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255,255,255,${this.opacity})`;
        ctx.fill();
      }
    }

    for (let i = 0; i < 70; i++) particles.push(new Particle());

    function animateParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach(p => { p.update(); p.draw(); });
      requestAnimationFrame(animateParticles);
    }
    animateParticles();
  </script>
</body>
</html>
